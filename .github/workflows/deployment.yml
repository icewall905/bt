name: Deployment checks
on:
  push:
    paths: ['setup*', 'manage*', 'scripts/**', 'compose*', 'Dockerfile', '.dockerignore', '.gitattributes', 'backend/bt/**', 'backend/tests/test_setup.py', 'backend/tests/test_profile_pins.py', '.github/workflows/deployment.yml']
  pull_request:
    paths: ['setup*', 'manage*', 'scripts/**', 'compose*', 'Dockerfile', '.dockerignore', '.gitattributes', 'backend/bt/**', 'backend/tests/test_setup.py', 'backend/tests/test_profile_pins.py', '.github/workflows/deployment.yml']
  workflow_dispatch:

jobs:
  scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v
      - name: PowerShell setup and parsing
        shell: pwsh
        run: ./scripts/tests/windows.ps1

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start with portable defaults
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.nvidia.yaml config --quiet
          docker compose up -d --build --wait --wait-timeout 240
          curl --fail http://localhost:6645/api/health
      - name: First-run and profile PIN tests
        run: docker run --rm --entrypoint python -e BT_DATA_DIR=/tmp/bt-tests -v "$PWD/backend/tests:/tests:ro" bettertube:latest -m pytest /tests/test_setup.py /tests/test_profile_pins.py -q
      - name: Logs
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop
        if: always()
        run: docker compose down
